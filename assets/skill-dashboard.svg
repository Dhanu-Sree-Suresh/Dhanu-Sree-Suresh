<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436" width="520" height="436" role="img" aria-labelledby="dash-title">
  <title id="dash-title">Self-assessed skill dashboard</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2c3e50; }
    .l { font-size: 14px; font-weight: 600; }
    .v { font-size: 28px; font-weight: 700; text-anchor: end; }
      @media (prefers-color-scheme: dark) {
      [fill="#f8f9fa"] { fill: #161b22; }
      [stroke="#e3e8ec"] { stroke: #30363d; }
      [stroke="#d5dde5"] { stroke: #3d444d; }
      [fill="#d4e9e2"] { fill: #1d3a33; }
      [fill="#d6e2f0"] { fill: #1e2f44; }
      [fill="#e4eff8"] { fill: #20344a; }
      [fill="#e3d7f5"] { fill: #2e2745; }
      [fill="#f7dde8"] { fill: #432236; }
      [fill="#fbe8c6"] { fill: #43351a; }
      [fill="#f6dcd8"] { fill: #43241f; }
      [fill="#fff"] { fill: #0d1117; }
      text:not([fill]) { fill: #e6edf3; }
      text[fill="#2c3e50"] { fill: #e6edf3; }
      text.s { fill: #b6c2cf; }
      .sep { stroke: #30363d; }
      .p rect { fill: #1e2f44; } .d rect { fill: #20344a; } .m rect { fill: #1d3a33; }
      .b rect { fill: #1e2f44; } .db rect { fill: #26323f; } .a rect { fill: #432236; } .f rect { fill: #2e2745; }
    }
  </style>

  <rect x="1" y="1" width="518" height="434" rx="20" fill="#f8f9fa" stroke="#e3e8ec"/>
  <text x="16" y="34" font-size="15" font-weight="700">skill dashboard</text>

  <!-- Row 1 -->
  <rect x="16" y="56" width="236" height="76" rx="14" fill="#d4e9e2"/>
  <text class="l" x="34" y="86">AI / ML</text><text class="v" x="234" y="94">95</text>
  <rect x="34" y="106" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="34" y="106" width="190" height="8" rx="4" fill="#54B39A"><animate attributeName="width" from="0" to="190" dur="1.2s" fill="freeze"/></rect>

  <rect x="268" y="56" width="236" height="76" rx="14" fill="#d6e2f0"/>
  <text class="l" x="286" y="86">Data Engineering</text><text class="v" x="486" y="94">95</text>
  <rect x="286" y="106" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="286" y="106" width="190" height="8" rx="4" fill="#6092C1"><animate attributeName="width" from="0" to="190" dur="1.2s" fill="freeze"/></rect>

  <!-- Row 2 -->
  <rect x="16" y="144" width="236" height="76" rx="14" fill="#d4e9e2"/>
  <text class="l" x="34" y="174">Python</text><text class="v" x="234" y="182">95</text>
  <rect x="34" y="194" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="34" y="194" width="190" height="8" rx="4" fill="#7FB8A4"><animate attributeName="width" from="0" to="190" dur="1.2s" fill="freeze"/></rect>

  <rect x="268" y="144" width="236" height="76" rx="14" fill="#e3d7f5"/>
  <text class="l" x="286" y="174">NLP</text><text class="v" x="486" y="182">92</text>
  <rect x="286" y="194" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="286" y="194" width="184" height="8" rx="4" fill="#8C7BB8"><animate attributeName="width" from="0" to="184" dur="1.2s" fill="freeze"/></rect>

  <!-- Row 3 -->
  <rect x="16" y="232" width="236" height="76" rx="14" fill="#d6e2f0"/>
  <text class="l" x="34" y="262">Data Science</text><text class="v" x="234" y="270">90</text>
  <rect x="34" y="282" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="34" y="282" width="180" height="8" rx="4" fill="#7FAFD4"><animate attributeName="width" from="0" to="180" dur="1.2s" fill="freeze"/></rect>

  <rect x="268" y="232" width="236" height="76" rx="14" fill="#d6e2f0"/>
  <text class="l" x="286" y="262">Big Data</text><text class="v" x="486" y="270">90</text>
  <rect x="286" y="282" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="286" y="282" width="180" height="8" rx="4" fill="#6092C1"><animate attributeName="width" from="0" to="180" dur="1.2s" fill="freeze"/></rect>

  <!-- Row 4 -->
  <rect x="16" y="320" width="236" height="76" rx="14" fill="#fbe8c6"/>
  <text class="l" x="34" y="350">Statistics</text><text class="v" x="234" y="358">85</text>
  <rect x="34" y="370" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="34" y="370" width="170" height="8" rx="4" fill="#E8A317"><animate attributeName="width" from="0" to="170" dur="1.2s" fill="freeze"/></rect>

  <rect x="268" y="320" width="236" height="76" rx="14" fill="#f7dde8"/>
  <text class="l" x="286" y="350">Web Applications</text><text class="v" x="486" y="358">85</text>
  <rect x="286" y="370" width="200" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="286" y="370" width="170" height="8" rx="4" fill="#D46087"><animate attributeName="width" from="0" to="170" dur="1.2s" fill="freeze"/></rect>

  <text x="260" y="420" text-anchor="middle" font-size="11.5" style="fill:#6B8DAF">colour = domain · bar = self-rating out of 100 · not a benchmark</text>
</svg>
