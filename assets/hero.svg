<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Hero banner</title>
  <desc id="hero-desc">AI × Data × Engineering. Building between data and intelligence.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 3 6; animation: flow 3s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.7); } }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .flow { animation: none; } }
  </style>

  <rect x="1" y="1" width="798" height="258" rx="20" fill="#f8f9fa" stroke="#e3e8ec"/>

  <!-- identity -->
  <rect x="40" y="34" width="232" height="28" rx="14" fill="#d4e9e2"/>
  <text x="156" y="53" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2c3e50">AI × DATA × ENGINEERING</text>

  <text x="40" y="112" font-size="40" font-weight="700" fill="#2c3e50">Dhanu Sree Suresh</text>
  <text x="40" y="146" font-size="18" fill="#2c3e50">Building between data and intelligence.</text>
  <text x="40" y="172" font-size="14" fill="#6B8DAF">Messy data in, working systems out.</text>

  <!-- status -->
  <rect x="40" y="198" width="366" height="32" rx="16" fill="#fbe8c6"/>
  <circle class="pulse" cx="58" cy="214" r="4" fill="#E8A317"/>
  <text x="72" y="219" font-size="13" fill="#2c3e50">currently exploring · AI in aviation · ML in security</text>

  <!-- data → models → systems network -->
  <path class="flow" fill="none" stroke="#6092C1" stroke-opacity=".5" stroke-width="1.3"
    d="M540 70L630 90M540 70L630 130M540 70L630 170M540 110L630 90M540 110L630 130M540 110L630 170M540 150L630 90M540 150L630 130M540 150L630 170M540 190L630 90M540 190L630 130M540 190L630 170M630 90L720 110M630 90L720 150M630 130L720 110M630 130L720 150M630 170L720 110M630 170L720 150"/>
  <g fill="#6092C1">
    <circle cx="540" cy="70" r="6"/><circle cx="540" cy="110" r="6"/><circle cx="540" cy="150" r="6"/><circle cx="540" cy="190" r="6"/>
  </g>
  <g fill="#8C7BB8">
    <circle cx="630" cy="90" r="7"/><circle cx="630" cy="130" r="7"/><circle cx="630" cy="170" r="7"/>
  </g>
  <g fill="#54B39A">
    <circle cx="720" cy="110" r="8"/><circle cx="720" cy="150" r="8"/>
  </g>
  <g font-size="12" fill="#6B8DAF" text-anchor="middle">
    <text x="540" y="226">data</text><text x="630" y="226">models</text><text x="720" y="226">systems</text>
  </g>
</svg>
