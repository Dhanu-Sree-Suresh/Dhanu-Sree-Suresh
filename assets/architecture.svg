<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="420" height="500" role="img" aria-labelledby="arch-title">
  <title id="arch-title">Data to Analysis, forking into ML/AI and NLP, merging into Engineering, ending in Application</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .t { font-size: 15px; font-weight: 700; fill: #2c3e50; }
    .s { font-size: 11.5px; fill: #4a5d6e; }
    .link { fill: none; stroke: #8a9bab; stroke-width: 1.6; stroke-dasharray: 4 5; animation: flow 2.5s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .link { animation: none; } }
    @media (prefers-color-scheme: dark) {
      [fill="#f8f9fa"] { fill: #161b22; }
      [stroke="#e3e8ec"] { stroke: #30363d; }
      [stroke="#d5dde5"] { stroke: #3d444d; }
      [fill="#d4e9e2"] { fill: #1d3a33; }
      [fill="#d6e2f0"] { fill: #1e2f44; }
      [fill="#e4eff8"] { fill: #20344a; }
      [fill="#e3d7f5"] { fill: #2e2745; }
      [fill="#f7dde8"] { fill: #432236; }
      [fill="#fbe8c6"] { fill: #43351a; }
      [fill="#f6dcd8"] { fill: #43241f; }
      [fill="#fff"] { fill: #0d1117; }
      text:not([fill]) { fill: #e6edf3; }
      text[fill="#2c3e50"] { fill: #e6edf3; }
      text.s { fill: #b6c2cf; }
      .sep { stroke: #30363d; }
      .p rect { fill: #1e2f44; } .d rect { fill: #20344a; } .m rect { fill: #1d3a33; }
      .b rect { fill: #1e2f44; } .db rect { fill: #26323f; } .a rect { fill: #432236; } .f rect { fill: #2e2745; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a9bab"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="418" height="498" rx="20" fill="#f8f9fa" stroke="#e3e8ec"/>

  <!-- connectors -->
  <path class="link" marker-end="url(#ar)" d="M210 76V112"/>
  <path class="link" marker-end="url(#ar)" d="M210 164C210 186 110 182 110 204"/>
  <path class="link" marker-end="url(#ar)" d="M210 164C210 186 310 182 310 204"/>
  <path class="link" marker-end="url(#ar)" d="M110 256C110 280 210 280 210 304"/>
  <path class="link" marker-end="url(#ar)" d="M310 256C310 280 210 280 210 304"/>
  <path class="link" marker-end="url(#ar)" d="M210 356V396"/>

  <!-- nodes -->
  <rect x="130" y="24" width="160" height="52" rx="14" fill="#d6e2f0" stroke="#6092C1"/>
  <text class="t" x="210" y="46">DATA</text><text class="s" x="210" y="63">raw · messy · streaming</text>

  <rect x="130" y="112" width="160" height="52" rx="14" fill="#e4eff8" stroke="#7FAFD4"/>
  <text class="t" x="210" y="134">ANALYSIS</text><text class="s" x="210" y="151">explore · statistics</text>

  <rect x="30" y="204" width="160" height="52" rx="14" fill="#d4e9e2" stroke="#54B39A"/>
  <text class="t" x="110" y="226">ML / AI</text><text class="s" x="110" y="243">PyTorch · scikit-learn</text>

  <rect x="230" y="204" width="160" height="52" rx="14" fill="#e3d7f5" stroke="#8C7BB8"/>
  <text class="t" x="310" y="226">NLP</text><text class="s" x="310" y="243">RAG · transformers</text>

  <rect x="130" y="304" width="160" height="52" rx="14" fill="#d6e2f0" stroke="#6092C1"/>
  <text class="t" x="210" y="326">ENGINEERING</text><text class="s" x="210" y="343">Spark · Kafka · SQL</text>

  <rect x="130" y="396" width="160" height="52" rx="14" fill="#f7dde8" stroke="#D46087"/>
  <text class="t" x="210" y="418">APPLICATION</text><text class="s" x="210" y="435">Flask · Streamlit</text>

  <text x="210" y="478" font-size="12" font-style="italic" fill="#6B8DAF">models are only useful once they become systems</text>
</svg>
